<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vastu Score Card | Vastu Guide</title>
  <meta name="description" content="Your overall Vastu score, combining every room checklist into one card with recommendations." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%95%89%EF%B8%8F</text></svg>" />
</head>
<body class="text-stone-800 antialiased">
  <header id="site-header" class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-stone-100"></header>
  <div id="disclaimer-banner"></div>

  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-12">
    <a href="room-checker.html" class="text-sm text-amber-700 hover:text-amber-900 font-medium">← Room Checker</a>

    <div class="flex items-center gap-3 mt-4 mb-2">
      <span class="text-4xl" aria-hidden="true">📊</span>
      <h1 class="font-serif text-3xl sm:text-4xl font-bold text-stone-900">Vastu Score Card</h1>
    </div>
    <p class="text-lg text-stone-600 leading-relaxed mb-8 max-w-2xl">
      A combined view of every room you've checked, generated from your answers in the Room-by-Room Checker.
    </p>

    <div id="score-content"></div>

    <div class="flex justify-between text-sm pt-8">
      <a href="room-checker.html" class="text-amber-700 hover:text-amber-900 font-medium">← Update your checklist</a>
      <a href="progress.html" class="text-amber-700 hover:text-amber-900 font-medium">My Progress →</a>
    </div>
  </main>

  <footer id="site-footer" class="bg-stone-50 border-t border-stone-100 mt-8"></footer>

  <script src="js/checker-data.js"></script>
  <script src="js/badges.js"></script>
  <script src="js/main.js"></script>
  <script>
    function scoreColor(pct) {
      if (pct >= 80) return "text-green-700";
      if (pct >= 50) return "text-amber-700";
      return "text-red-700";
    }
    function barColor(pct) {
      if (pct >= 80) return "bg-green-600";
      if (pct >= 50) return "bg-amber-500";
      return "bg-red-500";
    }

    function render() {
      const roomKeys = Object.keys(CHECKLISTS);
      const answeredRooms = roomKeys.filter((k) => hasAnyAnswers(k));
      const content = document.getElementById("score-content");

      if (answeredRooms.length === 0) {
        content.innerHTML = `
          <div class="bg-white rounded-2xl border border-stone-100 p-10 text-center">
            <p class="text-4xl mb-3" aria-hidden="true">🗒️</p>
            <p class="text-stone-600 mb-5">You haven't completed any room checklists yet.</p>
            <a href="room-checker.html" class="inline-block px-6 py-3 rounded-full bg-amber-800 text-white font-medium hover:bg-amber-900 transition-colors">Start the Room Checker</a>
          </div>`;
        return;
      }

      let totalChecked = 0;
      let totalItems = 0;
      const roomRows = roomKeys
        .map((key) => {
          if (!answeredRooms.includes(key)) return null;
          const def = CHECKLISTS[key];
          const s = roomScoreOutOf10(key);
          totalChecked += s.checked;
          totalItems += s.total;
          return { key, def, s };
        })
        .filter(Boolean);

      const overallPct = Math.round((totalChecked / totalItems) * 100);

      if (overallPct >= 80) maybeUnlockAndNotify("balanced-home");

      // Gather up to 5 unaddressed items (highest-value recommendations)
      const recommendations = [];
      roomKeys.forEach((key) => {
        const answers = getChecklistAnswers(key);
        CHECKLISTS[key].items.forEach((item) => {
          if (answers[item.id] === false && recommendations.length < 5) {
            recommendations.push({ room: CHECKLISTS[key].label, ...item });
          }
        });
      });

      content.innerHTML = `
        <div class="bg-white rounded-2xl border border-stone-100 p-8 mb-6 text-center">
          <p class="text-sm font-semibold uppercase tracking-wide text-stone-400 mb-2">Overall Score</p>
          <p class="text-5xl font-serif font-bold ${scoreColor(overallPct)}">${overallPct}%</p>
          <p class="text-xs text-stone-400 mt-2">Based on ${answeredRooms.length} of ${roomKeys.length} rooms checked so far</p>
        </div>

        <div class="bg-white rounded-2xl border border-stone-100 p-6 mb-6">
          <h2 class="font-serif text-lg font-bold text-stone-900 mb-4">Room Breakdown</h2>
          <div class="space-y-4">
            ${roomRows
              .map(
                ({ def, s }) => `
              <div>
                <div class="flex justify-between text-sm mb-1">
                  <span class="font-medium text-stone-700 flex items-center gap-1.5">
                    <span aria-hidden="true">${def.icon}</span> ${def.label}
                  </span>
                  <span class="font-semibold text-stone-600">${s.score10}/10</span>
                </div>
                <div class="h-2 rounded-full bg-stone-100 overflow-hidden">
                  <div class="h-full ${barColor(s.score10 * 10)} rounded-full" style="width:${s.score10 * 10}%"></div>
                </div>
              </div>`
              )
              .join("")}
          </div>
          ${
            answeredRooms.length < roomKeys.length
              ? `<p class="text-xs text-stone-400 mt-4">Not checked yet: ${roomKeys
                  .filter((k) => !answeredRooms.includes(k))
                  .map((k) => CHECKLISTS[k].label)
                  .join(", ")}</p>`
              : ""
          }
        </div>

        ${
          recommendations.length > 0
            ? `
        <div class="region-note p-6">
          <h2 class="font-semibold text-amber-900 mb-3">Recommendations</h2>
          <ul class="space-y-2 text-sm text-amber-900/90">
            ${recommendations
              .map((r) => `<li class="flex gap-2"><span aria-hidden="true">•</span><span><strong>${r.room}:</strong> ${r.remedy}</span></li>`)
              .join("")}
          </ul>
        </div>`
            : `
        <div class="region-note p-6 text-sm text-amber-900">
          Every checked item in your answered rooms is already aligned with traditional Vastu guidance. Nice work!
        </div>`
        }
      `;
    }

    render();
  </script>
</body>
</html>
